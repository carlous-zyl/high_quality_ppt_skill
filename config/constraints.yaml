# 约束规则引擎
global_hard_rules:
  - "金字塔原理：结论先行，以上统下，归类分组，逻辑递进，层级≤3层"
  - "单页单核心观点：每页1个结论式标题，所有内容服务于该观点"
  - "信息密度：单页正文≤300字，核心信息≤3行"
  - "受众适配：内容深度100%匹配目标受众"
  - "品牌合规：严格符合VI规范"

module_rules:
  content_structure:
    - "标题为结论式表达，禁止描述性标题"
    - "叙事线：是什么→为什么→怎么做→效果→下一步"
    - "技术分层：核心原理放正文，细节放备注"
    - "论点有量化数据/可溯源案例支撑"
    - "每3-4页设置1个叙事钩子"

  visual_presentation:
    - "遵守四大设计原则：对齐、对比、重复、亲密性"
    - "字体≤2种，字号层级清晰，标题与正文差≥4号"
    - "主色≤3种，辅助色≤2种，重点高亮≤10%"
    - "文字与背景对比度≥4.5:1"
    - "全稿版式、图标风格、页边距统一"

  chart_code:
    - "图表类型匹配数据：对比→柱状图，趋势→折线图，占比→环形图"
    - "单页图表≤1个，数据系列≤6个，标注单位与数据源"
    - "代码行数≤20行，仅展示核心逻辑，完整代码放备注"
    - "代码用等宽字体，带行号与语法高亮，字号≥14号"
