# 风格E：企业战略风（深海军蓝 + 橙强调）
# 源自用户上传的《知识中台必要性.pptx》视觉系统
name: navy_corporate
display_name: 企业战略风（深海军蓝 + 橙）
version: 1
source: user_template
extracted_at: '2026-07-24'
keywords: [企业战略, 战略汇报, 知识中台, 海军蓝, navy, 深蓝, 橙色, corporate, enterprise, 知识管理]

slide:
  width_in: 10.0
  height_in: 5.625
  aspect: "16:9"

palette:
  background_dark: "0A1A2F"        # 海军蓝（封面/分隔/结尾主底）
  background_dark_2: "0F2C5A"      # 海军蓝渐变终点
  background_light: "FFFFFF"       # 内容页主底
  card_dark: "142B45"              # 深色卡片
  card_light: "FFFFFF"
  card_subtle: "F5F7FA"            # 极浅灰底
  primary: "0A1A2F"                # 海军蓝主色（标题色/重点）
  primary_light: "1B3A6B"          # 中度蓝
  primary_bright: "2DD4BF"         # 提亮青（点睛）
  accent: "F39C12"                 # 橙强调（标签/钩子/关键数据）
  accent_light: "F5B041"           # 浅橙
  accent2: "3B82F6"                # 信息蓝
  success: "10B981"
  warning: "EF4444"
  purple: "8B5CF6"
  text_main: "1A2A40"              # 深色主文字
  text_sub: "64748B"               # 副文字
  text_on_dark: "FFFFFF"
  text_on_dark_sub: "94A3B8"
  card_bg_light: "F5F7FA"
  divider: "E2E8F0"                # 浅分割线

fonts:
  latin: Arial
  cjk: Noto Sans SC
  cjk_fallback: PingFang SC
  title_max_pt: 40
  title_min_pt: 24
  body_pt: 11
  caption_pt: 9

layout:
  cover:
    background: image_dark
    overlay_transparency: 45
    image_transparency: 10
    elements: [top_bar, tag, title, subtitle, source_line]
  content:
    background: light
    title_bar: true
    card_style: rounded_shadow
  section_divider:
    background: image_dark
    overlay_transparency: 45
    image_transparency: 10
    elements: [part_no, title, divider_line, description]
  closing:
    background: image_dark
    overlay_transparency: 45

imagery:
  mode: workbuddy
  background_transparency: 10
  illustration_transparency: 30
  icon_color_on_light: "0A1A2F"
  icon_color_on_dark: "FFFFFF"
  prompt_style: "abstract digital art, deep navy and orange tones, futuristic, corporate, professional, high resolution, 16:9, no text, no watermark"

extraction:
  source_file: "知识中台必要性.pptx"
  source_pages: 3
  source_density: "3页全图形式, 高信息密度"
  derived_from: "用户上传 2026-07-24"
