# 内置风格A：咨询科技风（暗色）
# 源自《三方投顾数智化转型战略》实战PPT沉淀
name: consulting_tech_dark
display_name: 咨询科技风（暗色）
version: 1
source: manual
extracted_at: null
keywords: [咨询, 科技, 暗色, 深色, 战略, 数字化转型, 金融, 青绿, teal, 咨询风]

slide:
  width_in: 10.0
  height_in: 5.625
  aspect: "16:9"

palette:
  background_dark: "0F172A"        # slate-900，封面/分隔/结尾
  background_light: "F8FAFC"       # 内容页
  card_dark: "1E293B"              # slate-800
  card_light: "FFFFFF"
  primary: "0D9488"                # teal-600
  primary_light: "14B8A6"          # teal-500
  primary_bright: "2DD4BF"         # teal-400
  accent: "F59E0B"                 # amber-500
  accent2: "3B82F6"                # blue-500
  success: "10B981"                # green-500
  warning: "EF4444"                # red-500
  purple: "8B5CF6"                 # 标签紫
  text_main: "334155"              # slate-700
  text_sub: "64748B"               # slate-500
  text_on_dark: "FFFFFF"
  text_on_dark_sub: "94A3B8"       # slate-400
  card_bg_light: "F1F5F9"          # slate-100

fonts:
  latin: Arial
  cjk: Noto Sans SC
  cjk_fallback: PingFang SC
  title_max_pt: 40
  title_min_pt: 24
  body_pt: 11
  caption_pt: 9

layout:
  cover:
    background: image_dark
    overlay_transparency: 45
    image_transparency: 10
    elements: [top_bar, tag, title, subtitle, metric_cards]
    metric_cards: 3
  content:
    background: light
    title_bar: true
    card_style: rounded_shadow
  section_divider:
    background: image_dark
    overlay_transparency: 45
    image_transparency: 10
    elements: [part_no, title, divider_line, description]
  closing:
    background: image_dark
    overlay_transparency: 45

imagery:
  mode: workbuddy
  background_transparency: 10
  illustration_transparency: 30
  icon_color_on_light: "0D9488"
  icon_color_on_dark: "FFFFFF"
  prompt_style: "abstract digital art, teal and dark slate tones, futuristic, professional, high resolution, 16:9, no text, no watermark"

extraction: null
