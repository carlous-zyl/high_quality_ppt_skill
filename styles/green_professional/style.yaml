# 内置风格B：绿色专业风
# 源自《职业规划完整指南》参考PPT视觉规范
name: green_professional
display_name: 绿色专业风
version: 1
source: manual
extracted_at: null
keywords: [绿色, 专业, 清新, 环保, 能源, 农业, 健康, 教育, 培训]

slide:
  width_in: 10.0
  height_in: 5.625
  aspect: "16:9"

palette:
  background_dark: "1E293B"        # 深色封面/结尾
  background_light: "FFFFFF"       # 白底内容页
  card_dark: "1E293B"
  card_light: "FFFFFF"
  primary: "047857"                # 深绿
  primary_light: "059669"          # 中绿
  primary_bright: "10B981"         # 亮绿
  accent: "F97316"                 # 橙色徽章
  accent2: "6EE7B7"                # 强调浅绿
  success: "10B981"
  warning: "EF4444"
  orange_light_bg: "FFF7ED"        # 橙色浅底
  green_light_bg: "E6F9F0"         # 绿色浅底
  text_main: "334155"
  text_sub: "64748B"
  text_on_dark: "FFFFFF"
  text_on_dark_sub: "94A3B8"

fonts:
  latin: Arial
  cjk: Noto Sans SC
  cjk_fallback: PingFang SC
  title_max_pt: 36
  title_min_pt: 22
  body_pt: 11
  caption_pt: 9

layout:
  cover:
    background: dark
    elements: [title, subtitle, metric_cards]
    metric_cards: 3
  content:
    background: light
    title_bar: false
    card_style: rounded_flat       # 白色圆角卡片 + 编号徽章
    badge_style: orange_numbered   # 橙色编号徽章
  toc:
    background: light
    badge_style: green_circle      # 绿色编号圆圈
  steps:
    badge_style: fast_labels       # F/A/S/T 彩色步骤标签
  closing:
    background: dark
    elements: [qa_title, divider_line]

imagery:
  mode: workbuddy
  background_transparency: 10
  illustration_transparency: 30
  icon_color_on_light: "FF6F00"    # 琥珀橙（亮底）
  icon_color_on_dark: "FFFFFF"
  prompt_style: "minimalist digital illustration, green and orange accents, clean composition, white background, professional, no text"

extraction: null
