# ============================================================
# style.yaml — PPT 风格样例 schema 模板
# 复制本文件到 styles/<style_name>/style.yaml 后逐项填写
# 色值约定：6 位 hex 大写，不带 # 前缀（PptxGenJS 约定）
# ============================================================

name: style_id_snake_case          # 风格ID，与目录名一致
display_name: 风格中文名
version: 1
source: manual                     # manual | extracted:<源文件名>
extracted_at: null                 # 提取时间（ISO8601），手工创建填 null
keywords: []                       # 触发关键词，用于 registry 匹配

# ---- 页面规格 ----
slide:
  width_in: 10.0                   # 16:9 = 10 x 5.625
  height_in: 5.625
  aspect: "16:9"

# ---- 色板 ----
palette:
  # 背景
  background_dark: "0F172A"        # 封面/分隔/结尾页深色背景
  background_light: "F8FAFC"       # 内容页浅色背景
  card_dark: "1E293B"              # 深色卡片
  card_light: "FFFFFF"             # 浅色卡片
  # 主色（≤3种）
  primary: "0D9488"                # 主色
  primary_light: "14B8A6"          # 主色-亮
  primary_bright: "2DD4BF"         # 主色-强调亮
  # 辅助色（≤2种）
  accent: "F59E0B"                 # 高亮强调
  accent2: "3B82F6"                # 辅助2
  # 语义色
  success: "10B981"
  warning: "EF4444"
  # 文字
  text_main: "334155"              # 正文（浅底上）
  text_sub: "64748B"               # 副文本
  text_on_dark: "FFFFFF"           # 深底上的主文字
  text_on_dark_sub: "94A3B8"       # 深底上的副文字

# ---- 字体 ----
fonts:
  latin: Arial                     # 英文/数字
  cjk: Noto Sans SC                # 中文（macOS 回退 PingFang SC）
  title_max_pt: 40                 # 大标题字号上限
  title_min_pt: 24
  body_pt: 11                      # 正文字号
  caption_pt: 9                    # 注释/页码

# ---- 布局规范 ----
layout:
  cover:                           # 封面页
    background: dark               # dark | light | image
    overlay_transparency: 45       # 背景图上的暗色覆盖层透明度
    elements: [tag, title, subtitle, metric_cards]
  content:                         # 内容页
    background: light
    title_bar: true                # 页标题装饰条
    card_style: rounded_shadow     # rounded_shadow | flat | outlined
  section_divider:
    background: image_dark
    overlay_transparency: 45

# ---- 配图规范 ----
imagery:
  mode: workbuddy                  # placeholder | api | workbuddy
  background_transparency: 10      # 全屏背景图透明度（hero+overlay: 图10透明=90显示）
  illustration_transparency: 30    # 角落插图透明度（25-40）
  icon_color_on_light: "FF6F00"    # 浅底图标色
  icon_color_on_dark: "FFFFFF"     # 深底图标色

# ---- 提取统计（仅 extracted 来源填写）----
extraction:
  theme_colors: {}                 # pptx theme XML 原始 accent1-6 等
  top_text_colors: []              # [{hex, count}]
  top_fill_colors: []
  font_faces_seen: []
  avg_images_per_slide: 0
  slide_count: 0
